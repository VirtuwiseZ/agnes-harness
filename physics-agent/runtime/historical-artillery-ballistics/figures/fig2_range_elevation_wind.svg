<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" width="100%" height="auto" style="background:#0f131f;border:1px solid #252d42;border-radius:10px;font-family:system-ui,-apple-system,sans-serif">
  <!-- Title -->
  <text x="410" y="28" text-anchor="middle" fill="#f1f5f9" font-size="14.5" font-weight="600">图 2：火炮射程随发射仰角变化规律及风速扰动敏感性影响带</text>
  
  <!-- Plot Border & Gridlines -->
  <!-- Plot area: x: 80 -> 760 (width 680), y: 50 -> 340 (height 290) -->
  <!-- X range: theta from 1.0° to 3.8° (width 2.8° -> scale: 1° = 242.8px) -->
  <!-- Y range: range from 600m to 1800m (height 1200m -> scale: 100m = 24.16px) -->
  <rect x="80" y="50" width="680" height="290" fill="#141a29" stroke="#2a344d" stroke-width="1.2"/>
  
  <!-- Y Gridlines (Range: 600m, 800m, 1000m, 1200m, 1400m, 1600m, 1800m) -->
  <!-- 1800m=50, 1600m=98.3, 1400m=146.6, 1200m=195, 1000m=243.3, 800m=291.6, 600m=340 -->
  <line x1="80" y1="98" x2="760" y2="98" stroke="#1f283d" stroke-dasharray="4,4"/>
  <line x1="80" y1="147" x2="760" y2="147" stroke="#1f283d" stroke-dasharray="4,4"/>
  <line x1="80" y1="195" x2="760" y2="195" stroke="#1f283d" stroke-dasharray="4,4"/>
  <line x1="80" y1="243" x2="760" y2="243" stroke="#1f283d" stroke-dasharray="4,4"/>
  <line x1="80" y1="292" x2="760" y2="292" stroke="#1f283d" stroke-dasharray="4,4"/>

  <!-- X Gridlines (Theta: 1.0°, 1.5°, 2.0°, 2.5°, 3.0°, 3.5°) -->
  <!-- 1.0°=80, 1.5°=201.4, 2.0°=322.8, 2.5°=444.2, 3.0°=565.7, 3.5°=687.1 -->
  <line x1="201" y1="50" x2="201" y2="340" stroke="#1f283d" stroke-dasharray="4,4"/>
  <line x1="323" y1="50" x2="323" y2="340" stroke="#1f283d" stroke-dasharray="4,4"/>
  <line x1="444" y1="50" x2="444" y2="340" stroke="#1f283d" stroke-dasharray="4,4"/>
  <line x1="566" y1="50" x2="566" y2="340" stroke="#1f283d" stroke-dasharray="4,4"/>
  <line x1="687" y1="50" x2="687" y2="340" stroke="#1f283d" stroke-dasharray="4,4"/>

  <!-- Target Range Reference Line (1200m, Y=195) -->
  <line x1="80" y1="195" x2="760" y2="195" stroke="#ef4444" stroke-width="1.8" stroke-dasharray="6,4"/>
  <text x="750" y="188" text-anchor="end" fill="#fca5a5" font-size="11" font-weight="600">额定目标射程 X = 1200 m</text>

  <!-- Y-Axis Labels (Range m) -->
  <text x="72" y="344" text-anchor="end" fill="#94a3b8" font-size="11">600</text>
  <text x="72" y="296" text-anchor="end" fill="#94a3b8" font-size="11">800</text>
  <text x="72" y="247" text-anchor="end" fill="#94a3b8" font-size="11">1000</text>
  <text x="72" y="199" text-anchor="end" fill="#94a3b8" font-size="11" font-weight="700">1200</text>
  <text x="72" y="151" text-anchor="end" fill="#94a3b8" font-size="11">1400</text>
  <text x="72" y="102" text-anchor="end" fill="#94a3b8" font-size="11">1600</text>
  <text x="72" y="54" text-anchor="end" fill="#94a3b8" font-size="11">1800</text>
  <text x="24" y="195" text-anchor="middle" fill="#cbd5e1" font-size="12" transform="rotate(-90 24 195)">弹丸实际射程 X (m)</text>

  <!-- X-Axis Labels (Theta deg) -->
  <text x="80" y="358" text-anchor="middle" fill="#94a3b8" font-size="11">1.0°</text>
  <text x="201" y="358" text-anchor="middle" fill="#94a3b8" font-size="11">1.5°</text>
  <text x="323" y="358" text-anchor="middle" fill="#94a3b8" font-size="11">2.0°</text>
  <text x="444" y="358" text-anchor="middle" fill="#94a3b8" font-size="11">2.5°</text>
  <text x="566" y="358" text-anchor="middle" fill="#94a3b8" font-size="11">3.0°</text>
  <text x="687" y="358" text-anchor="middle" fill="#94a3b8" font-size="11">3.5°</text>
  <text x="410" y="375" text-anchor="middle" fill="#cbd5e1" font-size="12">火炮发射仰角 θ (deg)</text>

  <!-- Shaded Wind Uncertainty Band (between Headwind and Tailwind) -->
  <!-- 1.0°: tailwind=760m(301), headwind=520m(340); 3.5°: tailwind=1730m(66), headwind=1480m(127) -->
  <polygon points="80,301 201,215 323,142 390,105 566,35 687,15 687,127 566,160 390,225 323,260 201,310 80,340" fill="#3b82f6" fill-opacity="0.12"/>

  <!-- Curve 2: Tailwind (+10 m/s, Green) -->
  <path d="M80,301 Q323,142 687,15" fill="none" stroke="#10b981" stroke-width="2.2" stroke-dasharray="4,2"/>

  <!-- Curve 3: Headwind (-10 m/s, Amber) -->
  <path d="M80,340 Q323,260 687,127" fill="none" stroke="#f59e0b" stroke-width="2.2" stroke-dasharray="4,2"/>

  <!-- Curve 1: Nominal Calm Conditions (Blue Solid, hits 1200m at theta=2.278°, x=390) -->
  <path d="M80,323 Q323,205 687,70" fill="none" stroke="#3b82f6" stroke-width="3.2"/>

  <!-- Baseline Hit Point Intersection (theta = 2.278° -> x=390.4, Y=1200m -> y=195) -->
  <line x1="390" y1="195" x2="390" y2="340" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="3,3"/>
  <circle cx="390" cy="195" r="5" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5"/>
  <text x="398" y="190" fill="#7dd3fc" font-size="11" font-weight="700">基准命中点 (θ=2°17', 1200m)</text>

  <!-- Didion Crosswind Inset Formula Box -->
  <g transform="translate(110, 65)">
    <rect width="260" height="85" rx="6" fill="#182035" stroke="#4f8cff" stroke-width="1.2"/>
    <text x="130" y="20" text-anchor="middle" fill="#93c5fd" font-size="11" font-weight="600">野战一阶微扰速算灵敏度法则</text>
    <text x="15" y="40" fill="#e2e8f0" font-size="10.5">• 射程灵敏度：Δθ ≈ +17.5' 每 100 m 射程增量</text>
    <text x="15" y="58" fill="#e2e8f0" font-size="10.5">• 纵向风修正：Δθ_wind ≈ ±2.2' 每 1 m/s 逆/顺风</text>
    <text x="15" y="76" fill="#e2e8f0" font-size="10.5">• 迪迪翁侧偏：Z ≈ 1.08 m/(m/s), 偏航方位角 ≈ 3.1'/(m/s)</text>
  </g>

  <!-- Outside Flex Capsule Legend Bar (方案 B: 底部完全外置，零遮挡) -->
  <g transform="translate(80, 398)">
    <!-- Pill 1: Nominal Calm -->
    <rect x="0" y="0" width="175" height="26" rx="13" fill="#1e2638" stroke="#3b82f6" stroke-width="1.2"/>
    <line x1="12" y1="13" x2="30" y2="13" stroke="#3b82f6" stroke-width="3"/>
    <circle cx="21" cy="13" r="2.5" fill="#3b82f6"/>
    <text x="36" y="17" fill="#f1f5f9" font-size="10.5">无风标称射程曲线 (v0=450)</text>

    <!-- Pill 2: Tailwind -->
    <rect x="185" y="0" width="165" height="26" rx="13" fill="#1e2638" stroke="#10b981" stroke-width="1.2"/>
    <line x1="197" y1="13" x2="215" y2="13" stroke="#10b981" stroke-width="2.2" stroke-dasharray="4,2"/>
    <text x="221" y="17" fill="#f1f5f9" font-size="10.5">+10 m/s 顺风延伸带 (+126m)</text>

    <!-- Pill 3: Headwind -->
    <rect x="360" y="0" width="165" height="26" rx="13" fill="#1e2638" stroke="#f59e0b" stroke-width="1.2"/>
    <line x1="372" y1="13" x2="390" y2="13" stroke="#f59e0b" stroke-width="2.2" stroke-dasharray="4,2"/>
    <text x="396" y="17" fill="#f1f5f9" font-size="10.5">-10 m/s 逆风压低带 (-125m)</text>

    <!-- Pill 4: Target Threshold -->
    <rect x="535" y="0" width="145" height="26" rx="13" fill="#1e2638" stroke="#ef4444" stroke-width="1.2"/>
    <line x1="547" y1="13" x2="565" y2="13" stroke="#ef4444" stroke-width="1.8" stroke-dasharray="4,2"/>
    <text x="571" y="17" fill="#f1f5f9" font-size="10.5">1200m 目标基准线</text>
  </g>
</svg>
